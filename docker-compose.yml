version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nestjs_db
      MYSQL_USER: nestuser
      MYSQL_PASSWORD: nestpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nestjs:
    build: .
    container_name: nestjs_api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: nestuser
      DB_PASS: nestpassword
      DB_NAME: nestjs_db
      JWT_SECRET: supersecret_jwt_key
      JWT_EXPIRATION: 3600s
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_SECURE: "false"
      MAIL_USER: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: "CRM App <no-reply@yourcrm.com>"
      FRONTEND_URL: "http://localhost:3001"
    ports:
      - "3000:3000"
    command: npm run start:dev

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    restart: always
    ports:
      - "8025:8025"   # web UI — view caught emails at http://localhost:8025
      - "1025:1025"   # SMTP port

volumes:
  mysql_data: