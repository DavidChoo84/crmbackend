version: '3.8'

# Local development stack. Secrets now live in a .env file next to this file
# (copy .env.example -> .env and fill in). .env is git-ignored.

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-nestjs_db}
      MYSQL_USER: ${DB_USER:-nestuser}
      MYSQL_PASSWORD: ${DB_PASS:-nestpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nestjs:
    build:
      context: .
      target: build   # dev stage: full deps + source, so start:dev works
    container_name: nestjs_api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "3000:3000"
    command: npm run start:dev

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    restart: always
    ports:
      - "8025:8025"   # web UI — view caught emails at http://localhost:8025
      - "1025:1025"   # SMTP port

volumes:
  mysql_data:
